name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: 최신 파이어폭스 엔진(GeckoView) 버전 찾기
        id: gecko
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+' || true)
          echo "GeckoView: ${V:-자동 선택}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 내장 확장 버전에 빌드 번호 넣기 (진단에 표시)
        run: |
          sed -i 's/"version": "1.0.0"/"version": "1.0.${{ github.run_number }}"/' app/src/main/assets/ytab/manifest.json
          grep '"version"' app/src/main/assets/ytab/manifest.json

      - name: 서명 키 풀기
        env:
          MALKKEUM_KEYSTORE_PASSWORD: ${{ secrets.MALKKEUM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$MALKKEUM_KEYSTORE_PASSWORD" ]; then
            echo "::error::GitHub Secrets에 MALKKEUM_KEYSTORE_PASSWORD가 없어요. 저장소 Settings > Secrets and variables > Actions에서 추가하세요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/signing/malkkeum-release.jks.enc \
            -out "$RUNNER_TEMP/malkkeum-release.jks" \
            -pass env:MALKKEUM_KEYSTORE_PASSWORD
          echo "MALKKEUM_KEYSTORE=$RUNNER_TEMP/malkkeum-release.jks" >> "$GITHUB_ENV"

      - name: APK 만들기
        env:
          MALKKEUM_KEYSTORE_PASSWORD: ${{ secrets.MALKKEUM_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PgeckoVersion=${{ steps.gecko.outputs.version }}

      - name: 파일 이름 정리
        run: |
          cp app/build/outputs/apk/release/app-release.apk Malkkeum.apk
          rm -f "$RUNNER_TEMP/malkkeum-release.jks"

      - name: 릴리스에 올리기 (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 말끔 ${{ github.run_number }}
          body: |
            폰에서 Malkkeum.apk 를 눌러 설치하세요.
            파이어폭스 엔진: ${{ steps.gecko.outputs.version }}
          files: Malkkeum.apk
          make_latest: true
