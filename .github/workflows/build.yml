name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 최신 파이어폭스 엔진(GeckoView) 버전 찾기
        id: gecko
        run: |
          V=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+' || true)
          echo "GeckoView: ${V:-자동 선택}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: APK 만들기
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PgeckoVersion=${{ steps.gecko.outputs.version }}

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk Malkkeum.apk

      - name: 릴리스에 올리기 (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 말끔 ${{ github.run_number }}
          body: |
            폰에서 Malkkeum.apk 를 눌러 설치하세요.
            파이어폭스 엔진: ${{ steps.gecko.outputs.version }}
          files: Malkkeum.apk
          make_latest: true
