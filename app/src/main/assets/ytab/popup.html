<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 광고 분석·차단기</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <header>
    <h1>광고 분석·차단기</h1>
    <label class="switch" title="켜기/끄기">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
  </header>

  <section class="stats">
    <div><b id="s-blocked">0</b><small>차단한 광고</small></div>
    <div><b id="s-analyzed">0</b><small>분석한 광고</small></div>
    <div><b id="s-stripped">0</b><small>사전 제거</small></div>
  </section>

  <section class="mode">
    <label><input type="radio" name="mode" value="all"> 전체 차단</label>
    <label><input type="radio" name="mode" value="select"> 고른 종류만 차단</label>
    <p class="hint" id="mode-hint"></p>
  </section>

  <section class="mode" id="method-box">
    <b class="label">영상 광고 처리 방식</b>
    <label><input type="radio" name="method" value="strip"> 미리 제거</label>
    <label><input type="radio" name="method" value="skip"> 빨리 넘기기</label>
    <p class="hint" id="method-hint"></p>
  </section>

  <nav>
    <button class="tab on" data-tab="cats">카테고리</button>
    <button class="tab" data-tab="log">광고 기록</button>
    <button class="tab" data-tab="adv">차단 광고주</button>
  </nav>

  <section class="panel" id="cats"></section>
  <section class="panel hidden" id="log"></section>
  <section class="panel hidden" id="adv">
    <form id="adv-form">
      <input id="adv-input" placeholder="광고주 이름 직접 추가 (예: 쿠팡)">
      <button>추가</button>
    </form>
    <ul id="adv-list"></ul>
  </section>

  <footer>
    <button id="clear">기록 지우기</button>
  </footer>

  <script src="classifier.js"></script>
  <script src="popup.js"></script>
</body>
</html>
